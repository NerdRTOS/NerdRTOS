<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="820" height="440" fill="#fafafa" rx="8"/>

  <!-- 标题 -->
  <text x="410" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">优先级继承（Priority Inheritance）</text>

  <!-- ===== 左侧线程标签 ===== -->
  <text x="60" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">线程A</text>
  <text x="60" y="120" text-anchor="middle" font-size="9" fill="#888">高优先级</text>

  <text x="60" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#e67e22">线程B</text>
  <text x="60" y="220" text-anchor="middle" font-size="9" fill="#888">中优先级</text>

  <text x="60" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#2980b9">线程C</text>
  <text x="60" y="320" text-anchor="middle" font-size="9" fill="#888">低优先级</text>

  <!-- ===== 横向虚线（泳道线） ===== -->
  <line x1="120" y1="105" x2="770" y2="105" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="120" y1="205" x2="770" y2="205" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="120" y1="305" x2="770" y2="305" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ===== 时间轴 ===== -->
  <line x1="120" y1="370" x2="780" y2="370" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="790" y="375" font-size="10" fill="#333">时间</text>

  <!-- 时间刻度 -->
  <line x1="150" y1="367" x2="150" y2="373" stroke="#333" stroke-width="1"/>
  <text x="150" y="390" text-anchor="middle" font-size="9" fill="#666">t0</text>

  <line x1="270" y1="367" x2="270" y2="373" stroke="#333" stroke-width="1"/>
  <text x="270" y="390" text-anchor="middle" font-size="9" fill="#666">t1</text>

  <line x1="360" y1="367" x2="360" y2="373" stroke="#333" stroke-width="1"/>
  <text x="360" y="390" text-anchor="middle" font-size="9" fill="#666">t2</text>

  <line x1="500" y1="367" x2="500" y2="373" stroke="#333" stroke-width="1"/>
  <text x="500" y="390" text-anchor="middle" font-size="9" fill="#666">t3</text>

  <line x1="610" y1="367" x2="610" y2="373" stroke="#333" stroke-width="1"/>
  <text x="610" y="390" text-anchor="middle" font-size="9" fill="#666">t4</text>

  <line x1="710" y1="367" x2="710" y2="373" stroke="#333" stroke-width="1"/>
  <text x="710" y="390" text-anchor="middle" font-size="9" fill="#666">t5</text>

  <!-- ================================================================ -->
  <!--  t0~t1: C运行（持锁），在低优先级行                               -->
  <!-- ================================================================ -->
  <rect x="150" y="290" width="120" height="30" rx="4" fill="#3498db" stroke="#2471a3" stroke-width="1.2"/>
  <text x="210" y="309" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">运行（持锁）</text>

  <text x="155" y="283" font-size="8" fill="#2980b9">获取锁</text>

  <!-- ================================================================ -->
  <!--  t1: A就绪，抢占C，尝试获取锁失败                                 -->
  <!-- ================================================================ -->
  <line x1="270" y1="320" x2="270" y2="120" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="258" y="140" font-size="8" fill="#c0392b" text-anchor="end">A就绪</text>

  <rect x="270" y="90" width="90" height="30" rx="4" fill="#e74c3c" stroke="#c0392b" stroke-width="1.2"/>
  <text x="315" y="109" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">尝试获取锁</text>

  <!-- t1~t2: A阻塞，触发优先级继承，C提升到高优先级行运行 -->
  <line x1="360" y1="120" x2="360" y2="290" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="348" y="180" font-size="8" fill="#27ae60" text-anchor="end">A阻塞</text>
  <text x="348" y="192" font-size="8" fill="#27ae60" text-anchor="end">C继承</text>

  <!-- A阻塞：从t2到t3 -->
  <rect x="360" y="90" width="140" height="30" rx="4" fill="#fadbd8" stroke="#e74c3c" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="430" y="109" text-anchor="middle" font-size="9" fill="#c0392b">阻塞等待</text>

  <!-- C在低优先级行变为就绪 -->
  <rect x="270" y="290" width="90" height="30" rx="4" fill="#85c1e9" stroke="#2471a3" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="315" y="309" text-anchor="middle" font-size="9" fill="#2980b9">就绪</text>

  <!-- ================================================================ -->
  <!--  t2~t3: C以继承的高优先级运行（在高优先级行显示）                   -->
  <!--  关键区别：C被提升，所以画在A行附近（但用C的蓝绿色标识）             -->
  <!-- ================================================================ -->
  <!-- C提升后运行块：紧贴高优先级行下方，用绿色表示继承状态 -->
  <rect x="360" y="130" width="140" height="28" rx="4" fill="#1abc9c" stroke="#16a085" stroke-width="1.2"/>
  <text x="430" y="148" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff">C运行（继承高优先级）</text>

  <!-- 继承标注：向上箭头从C行指向提升后的运行块 -->
  <line x1="380" y1="290" x2="380" y2="160" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="388" y="240" font-size="8" fill="#1e8449">优先级提升</text>

  <!-- ================================================================ -->
  <!--  t2: B就绪，但无法抢占C（C已继承高优先级）                         -->
  <!-- ================================================================ -->
  <line x1="360" y1="345" x2="360" y2="220" stroke="#e67e22" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="348" y="345" font-size="8" fill="#e67e22" text-anchor="end">B就绪</text>

  <rect x="360" y="190" width="250" height="30" rx="4" fill="#fdebd0" stroke="#e67e22" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="485" y="209" text-anchor="middle" font-size="9" fill="#d68910">就绪等待（无法抢占继承后的C）</text>

  <!-- ================================================================ -->
  <!--  t3: C释放锁，优先级恢复，A获得锁运行                              -->
  <!-- ================================================================ -->
  <line x1="500" y1="158" x2="500" y2="90" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="508" y="80" font-size="8" fill="#27ae60">C释放锁，优先级恢复</text>

  <!-- C回到低优先级行就绪 -->
  <rect x="500" y="290" width="110" height="30" rx="4" fill="#85c1e9" stroke="#2471a3" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="555" y="309" text-anchor="middle" font-size="9" fill="#2980b9">就绪（低优先级）</text>

  <!-- A获取锁运行 t3~t4 -->
  <rect x="500" y="90" width="110" height="30" rx="4" fill="#e74c3c" stroke="#c0392b" stroke-width="1.2"/>
  <text x="555" y="109" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">获取锁运行</text>

  <!-- ================================================================ -->
  <!--  t4: A完成，B运行                                                -->
  <!-- ================================================================ -->
  <line x1="610" y1="120" x2="610" y2="190" stroke="#e67e22" stroke-width="1.2" stroke-dasharray="4,2"/>

  <rect x="610" y="190" width="100" height="30" rx="4" fill="#f39c12" stroke="#d68910" stroke-width="1.2"/>
  <text x="660" y="209" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">运行</text>

  <!-- ================================================================ -->
  <!--  t5: B完成，C运行                                                -->
  <!-- ================================================================ -->
  <line x1="710" y1="220" x2="710" y2="290" stroke="#2980b9" stroke-width="1.2" stroke-dasharray="4,2"/>

  <rect x="710" y="290" width="50" height="30" rx="4" fill="#3498db" stroke="#2471a3" stroke-width="1.2"/>
  <text x="735" y="309" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">运行</text>

  <!-- ================================================================ -->
  <!--  对比标注                                                        -->
  <!-- ================================================================ -->
  <rect x="270" y="48" width="230" height="25" rx="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="385" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e8449">无反转：A不会被B延迟</text>

  <!-- ===== 说明文字 ===== -->
  <text x="410" y="425" text-anchor="middle" font-size="10" fill="#666">A阻塞时，C继承A的高优先级，B无法抢占C，C尽快释放锁后A立即运行</text>
</svg>
