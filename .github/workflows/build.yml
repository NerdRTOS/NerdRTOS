name: Build

on:
  push:
    branches: [dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover-bsp:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.bsp.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover BSP targets
        id: bsp
        shell: python
        run: |
          import json
          import os
          import pathlib

          configs = []
          for path in sorted(pathlib.Path(".github/workflows/bsp").glob("*.json")):
              config = json.loads(path.read_text())
              config.setdefault("id", path.stem)
              configs.append(config)

          if not configs:
              raise SystemExit("No BSP CI configs found.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=")
              output.write(json.dumps({"include": configs}, separators=(",", ":")))
              output.write("\n")

  build:
    name: ${{ matrix.id }}
    needs: discover-bsp
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-bsp.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache ARM toolchain
        if: ${{ !matrix.needs_riscv_toolchain }}
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi
          key: arm-toolchain-13.3

      - name: Install ARM toolchain
        if: ${{ !matrix.needs_riscv_toolchain && steps.cache-toolchain.outputs.cache-hit != 'true' }}
        run: |
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1/binrel/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi.tar.xz
          tar xf arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi.tar.xz

      - name: Add toolchain to PATH
        if: ${{ !matrix.needs_riscv_toolchain }}
        run: echo "${{ github.workspace }}/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi/bin" >> $GITHUB_PATH

      - name: Install RISC-V toolchain
        if: matrix.needs_riscv_toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xz-utils
          mkdir -p "${{ github.workspace }}/tools"
          cd "${{ github.workspace }}/tools"
          wget -q https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v13.2.0-2/xpack-riscv-none-elf-gcc-13.2.0-2-linux-x64.tar.gz
          tar -xf xpack-riscv-none-elf-gcc-13.2.0-2-linux-x64.tar.gz
          toolchain_dir="$(find "${{ github.workspace }}/tools" -maxdepth 1 -type d -name 'xpack-riscv-none-elf-gcc-*' | head -n 1)"
          if [ -z "$toolchain_dir" ] || [ ! -d "$toolchain_dir/bin" ]; then
            echo "RISC-V toolchain directory not found"
            find "${{ github.workspace }}/tools" -maxdepth 2 -type d -print
            exit 1
          fi
          for tool in "$toolchain_dir"/bin/riscv-none-elf-*; do
            name="$(basename "$tool")"
            ln -sf "$name" "$toolchain_dir/bin/${name/riscv-none-elf/riscv32-unknown-elf}"
          done
          echo "$toolchain_dir/bin" >> "$GITHUB_PATH"
          echo "PICO_TOOLCHAIN_PATH=$toolchain_dir/bin" >> "$GITHUB_ENV"

      - name: Cache Pico SDK
        if: matrix.needs_pico_sdk
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: pico-sdk
          key: pico-sdk-${{ hashFiles('bsp/raspi-pico2/pico_sdk_import.cmake') }}

      - name: Get Pico SDK
        if: matrix.needs_pico_sdk && steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/raspberrypi/pico-sdk.git --depth 1
          cd pico-sdk && git submodule update --init

      - name: Cache STM32 vendor drivers
        if: matrix.stm32_cube
        id: cache-stm32
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.source_dir }}/Drivers/CMSIS
            ${{ matrix.source_dir }}/Drivers/${{ matrix.stm32_series }}_HAL_Driver
          key: ${{ matrix.stm32_cube }}-${{ matrix.stm32_cube_ref }}

      - name: Get STM32 vendor drivers
        if: matrix.stm32_cube && steps.cache-stm32.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${{ matrix.stm32_cube_ref }}" "https://github.com/STMicroelectronics/${{ matrix.stm32_cube }}.git" stm32cube
          git -C stm32cube submodule update --init --depth 1 "Drivers/CMSIS/Device/ST/${{ matrix.stm32_series }}" "Drivers/${{ matrix.stm32_series }}_HAL_Driver"
          cp -r stm32cube/Drivers/CMSIS "${{ matrix.source_dir }}/Drivers/"
          cp -r "stm32cube/Drivers/${{ matrix.stm32_series }}_HAL_Driver" "${{ matrix.source_dir }}/Drivers/"

      - name: Install QEMU
        if: matrix.run_qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm

      - name: Configure ${{ matrix.id }}
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: cmake -S "${{ matrix.source_dir }}" -B "${{ matrix.build_dir }}" ${{ matrix.cmake_args }}

      - name: Build ${{ matrix.id }}
        run: |
          set -o pipefail
          cmake --build "${{ matrix.build_dir }}" --parallel "$(nproc)" 2>&1 | tee "${{ matrix.build_dir }}/build_log.txt"

      - name: Check build warnings
        run: python3 .github/scripts/check_build.py "${{ matrix.build_dir }}/build_log.txt"

      - name: Run QEMU smoke test
        if: matrix.run_qemu
        run: |
          set +e
          timeout "${{ matrix.qemu_timeout }}" qemu-system-arm -M "${{ matrix.qemu_machine }}" -nographic ${{ matrix.qemu_args }} -kernel "${{ matrix.build_dir }}/${{ matrix.executable }}"
          status=$?
          set -e

          if [ "$status" -eq 124 ]; then
            echo "QEMU smoke test reached timeout as expected."
            exit 0
          fi

          exit "$status"

